<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a0533" />
  <meta name="description" content="Sistema de pontuação para Gincana EJC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EJC Gincana" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>EJC Gincana 🏆</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getDatabase, ref, push, onValue, remove, set, get
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDj0HI5R6MCcijVDy-RLWlI2YK-JM03cAY",
      authDomain: "app-gincana-ejc.firebaseapp.com",
      databaseURL: "https://app-gincana-ejc-default-rtdb.firebaseio.com",
      projectId: "app-gincana-ejc",
      storageBucket: "app-gincana-ejc.firebasestorage.app",
      messagingSenderId: "448866938152",
      appId: "1:448866938152:web:06f3cbd240f65ab130741d"
    };

    // Inicializa o Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // CRUCIAL: Compartilha o banco com o app.js e avisa que está pronto
    window._fb = { db, ref, push, onValue, remove, set, get };
    document.dispatchEvent(new Event("firebase-ready"));
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ──────────────── SPLASH ──────────────── -->
<div id="splash">
  <div class="splash-inner">
    <div class="splash-cross">✝</div>
    <div class="splash-title">EJC</div>
    <div class="splash-sub">GINCANA</div>
  </div>
</div>

<!-- ──────────────── APP SHELL ──────────────── -->
<div id="app" class="hidden">

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-left">
      <span class="header-cross">✝</span>
      <span class="header-title">EJC <span>GINCANA</span></span>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="btn-add-score" title="Lançar Pontos">⚡</button>
      <button class="icon-btn" id="btn-add-team" title="Gerenciar Equipes">👥</button>
    </div>
  </header>

  <!-- NAV TABS -->
  <nav class="tab-bar">
    <button class="tab active" data-tab="home">🏠 Início</button>
    <button class="tab" data-tab="ranking">🏆 Ranking</button>
    <button class="tab" data-tab="charts">📊 Gráficos</button>
    <button class="tab" data-tab="history">📋 Histórico</button>
  </nav>

  <!-- ══════ TAB: HOME ══════ -->
<section id="tab-home" class="tab-content active">
    <div class="section-title">
        <span>TOP 3 DO PERÍODO</span>
  <div class="date-filter-home">
            <input type="date" id="home-date-start" class="date-input">
            <span class="filter-separator">ATÉ</span>
            <input type="date" id="home-date-end" class="date-input">
            <button id="btn-filter-home" class="filter-apply-btn">🔍</button>
        </div>
    </div>
    <div id="top3-cards" class="top3-grid"></div>

    <div class="section-title mt-2">PLACAR DE HOJE</div>
    <div id="today-list" class="score-list"></div>

    <div class="fab-area">
      <button class="fab-btn punishment" id="fab-punishment">⚠️ Punição</button>
      <button class="fab-btn primary" id="fab-score">⚡ Pontuar</button>
    </div>
  </section>

    <!-- ══════ TAB: RANKING ══════ -->
  <section id="tab-ranking" class="tab-content hidden">
    <div class="filter-bar">
        <button class="filter-btn active" data-period="day">Hoje</button>
        <button class="filter-btn" data-period="week">Semana</button>
        <button class="filter-btn" data-period="month">Mês</button>
        <button class="filter-btn" data-period="year">Ano 🏆</button>
    </div>    
    <!-- NOVO: Filtro Personalizado -->
    <div class="custom-filter-row">
        <input type="date" id="rank-start" class="date-input">
        <span class="filter-separator">ATÉ</span>
        <input type="date" id="rank-end" class="date-input">
        <button id="btn-filter-custom" class="filter-apply-btn">🔍</button>
    </div>

    <div id="ranking-list" class="ranking-list"></div>
</section>
  <!-- ══════ TAB: CHARTS ══════ -->
  <section id="tab-charts" class="tab-content hidden">
    <div class="filter-bar">
      <button class="filter-btn active" data-chart-period="week">Semana</button>
      <button class="filter-btn" data-chart-period="month">Mês</button>
    </div>
    <div class="chart-card">
      <div class="chart-label">Pontuação por Equipe</div>
      <div class="chart-wrap"><canvas id="chart-bar"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-label">Evolução no Período</div>
      <div class="chart-wrap"><canvas id="chart-line"></canvas></div>
    </div>
  </section>

  <!-- ══════ TAB: HISTORY ══════ -->
  <section id="tab-history" class="tab-content hidden">
    <div class="filter-bar search-bar">
      <input id="history-search" type="text" placeholder="🔍 Buscar equipe..." />
    </div>
    <div id="history-list" class="history-list"></div>
  </section>

</div>

<!-- ──────────────── MODAL: LANÇAR PONTOS ──────────────── -->
<div id="modal-score" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <span id="modal-score-title">⚡ Lançar Pontos</span>
      <button class="close-btn" data-close="modal-score">✕</button>
    </div>
    <div class="modal-body">
      <label>Equipe</label>
      <select id="score-team"></select>

      <label>Pontuação</label>
      <div class="quick-pts">
        <button class="qpt" data-v="10">+10</button>
        <button class="qpt" data-v="20">+20</button>
        <button class="qpt" data-v="50">+50</button>
        <button class="qpt" data-v="100">+100</button>
      </div>
      <input id="score-pts" type="number" placeholder="Ou digite o valor..." />

      <label>Descrição (opcional)</label>
      <input id="score-desc" type="text" placeholder="Ex: Prova da música" />

      <label>Data</label>
      <input id="score-date" type="date" />

      <input type="hidden" id="score-type" value="bonus" />
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" data-close="modal-score">Cancelar</button>
      <button class="btn-save" id="btn-save-score">Salvar</button>
    </div>
  </div>
</div>

<!-- ──────────────── MODAL: PUNIÇÃO ──────────────── -->
<div id="modal-punishment" class="modal hidden">
  <div class="modal-box punishment-box">
    <div class="modal-header">
      <span>⚠️ Lançar Punição</span>
      <button class="close-btn" data-close="modal-punishment">✕</button>
    </div>
    <div class="modal-body">
      <label>Equipe</label>
      <select id="pun-team"></select>

      <label>Penalidade</label>
      <div class="quick-pts punishment-pts">
        <button class="qpt bad" data-v="-10">-10</button>
        <button class="qpt bad" data-v="-20">-20</button>
        <button class="qpt bad" data-v="-50">-50</button>
        <button class="qpt bad" data-v="-100">-100</button>
      </div>
      <input id="pun-pts" type="number" placeholder="Ou digite (negativo)..." />

      <label>Motivo (importante!)</label>
      <input id="pun-desc" type="text" placeholder="Ex: Atraso na prova" />

      <label>Data</label>
      <input id="pun-date" type="date" />
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" data-close="modal-punishment">Cancelar</button>
      <button class="btn-save punishment-save" id="btn-save-pun">Aplicar Punição</button>
    </div>
  </div>
</div>

<!-- ──────────────── MODAL: EQUIPES ──────────────── -->
<div id="modal-teams" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <span>👥 Equipes</span>
      <button class="close-btn" data-close="modal-teams">✕</button>
    </div>
    <div class="modal-body">
      <div class="add-team-row">
        <input id="team-name-input" type="text" placeholder="Nome da equipe..." />
        <input id="team-color-input" type="color" value="#f59e0b" title="Cor da equipe" />
        <button id="btn-add-team-confirm">Adicionar</button>
      </div>
      <div id="teams-list" class="teams-manage-list"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" data-close="modal-teams">Fechar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
